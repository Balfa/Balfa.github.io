<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dublin GeoTrivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2a2e;
    --parchment:#efe9db;
    --door-red:#9c2b1f;
    --door-blue:#1f4e8c;
    --door-mustard:#d1a12e;
    --door-green:#2f6b4f;
    --line:rgba(28,42,46,0.14);
    --card:#fbf8f1;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Work Sans',sans-serif;
    background:var(--ink);
    color:var(--ink);
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .doorstripe{
    display:flex;height:8px;width:100%;
  }
  .doorstripe span{flex:1;}
  .doorstripe span:nth-child(1){background:var(--door-red);}
  .doorstripe span:nth-child(2){background:var(--door-mustard);}
  .doorstripe span:nth-child(3){background:var(--door-blue);}
  .doorstripe span:nth-child(4){background:var(--door-green);}

  header{
    background:var(--parchment);
    padding:18px 20px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(20px,3vw,28px);
    margin:0;
    letter-spacing:0.2px;
  }
  h1 span{color:var(--door-red);}
  .hud{display:flex;gap:22px;font-weight:600;font-size:13px;color:#6b6455;margin-left:12px;padding-left:24px;border-left:1px solid var(--line);align-self:stretch;align-items:center;}
  .hud b{font-family:'Fraunces',serif;font-size:22px;display:block;font-weight:700;color:var(--ink);}
  .hud div{text-align:center;}

  main{max-width:1440px;margin:0 auto;padding:20px 16px 60px;}

  .prompt{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 20px;
    display:flex;align-items:center;gap:16px;
    margin-bottom:16px;
  }
  .prompt svg{flex:none;}
  .prompt-text p{margin:0 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#6b6455;}
  .prompt-text h2{margin:0;font-family:'Fraunces',serif;font-size:clamp(24px,4vw,32px);}

  .mapwrap{
    position:relative;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 12px 30px rgba(0,0,0,0.35);
    background:#bcd7ea;
    cursor:crosshair;
    user-select:none;
    touch-action:none;
    aspect-ratio:1710/1272;
    width:100%;
  }
  .mapwrap.locked{cursor:default;}
  .mapwrap.panning{cursor:grabbing;}

  .mapcanvas{
    position:absolute;inset:0;
    transform-origin:0 0;
  }
  .mapcanvas img{display:block;width:100%;height:100%;pointer-events:none;}
  .connector{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;}

  .zoomctl{
    position:absolute;top:10px;right:10px;z-index:10;
    display:flex;flex-direction:column;gap:4px;
  }
  .zoomctl button{
    width:32px;height:32px;border-radius:7px;border:1px solid var(--line);
    background:rgba(251,248,241,0.92);color:var(--ink);font-size:17px;font-weight:700;
    cursor:pointer;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,0.2);
  }
  .zoomctl button:active{transform:translateY(1px);}
  .zoomctl button#zoomReset{font-size:13px;}

  .pin{
    position:absolute;
    transform:translate(-50%,-100%);
    pointer-events:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:5;
  }
  .pin svg{filter:drop-shadow(0 3px 4px rgba(0,0,0,0.4));}
  .pin .lbl{
    order:-1;
    margin-bottom:2px;
    background:rgba(28,42,46,0.92);
    color:#fbf8f1;
    font-size:12px;
    font-weight:600;
    padding:2px 7px;
    border-radius:5px;
    white-space:nowrap;
    box-shadow:0 2px 5px rgba(0,0,0,0.3);
  }
  .pin.answer .lbl{background:rgba(47,107,79,0.95);}

  .toast{
    position:absolute;
    bottom:14px;left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#f5efe0;
    padding:10px 18px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
  }

  button.primary{
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:15px;
    background:var(--door-red);
    color:#fff8ee;
    border:none;
    padding:12px 26px;
    border-radius:8px;
    cursor:pointer;
    transition:transform .15s ease;
  }
  button.primary:hover{transform:translateY(-1px);}
  button.primary:active{transform:translateY(0);}
  button.ghost{
    background:transparent;color:var(--ink);border:1px solid var(--line);
    font-family:'Work Sans',sans-serif;font-weight:600;padding:11px 24px;border-radius:8px;cursor:pointer;
  }

  .hint{color:#efe9db;text-align:center;font-size:14px;margin-top:10px;opacity:0.75;min-height:18px;}

  /* Game area: map + results panel, side by side once finished, stacked on narrow screens */
  .gamegrid{display:grid;grid-template-columns:1fr;gap:18px;align-items:start;}
  .gamegrid.finished{grid-template-columns:minmax(0,1.6fr) minmax(270px,1fr);}
  @media (max-width:860px){
    .gamegrid.finished{grid-template-columns:1fr;}
  }

  .results{
    display:none;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:22px 22px 18px;
    max-height:none;
  }
  .gamegrid.finished .results{display:block;}
  .results .sub{color:#6b6455;margin:0 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:1px;}
  .results h2{font-family:'Fraunces',serif;font-size:24px;margin:0 0 10px;color:var(--door-blue);}
  .results .bigscore{font-family:'Fraunces',serif;font-size:44px;font-weight:700;margin:0 0 2px;line-height:1;}
  .results .outof{color:#6b6455;font-size:13px;margin-bottom:16px;}
  .resultsTableWrap{max-height:360px;overflow-y:auto;margin:0 -4px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);}
  th{color:#6b6455;font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;position:sticky;top:0;background:var(--card);}
  td.pts{text-align:right;font-weight:600;}
  tr.resultRow{cursor:pointer;transition:background .12s ease;}
  tr.resultRow:hover, tr.resultRow.rowActive{background:rgba(28,42,46,0.06);}
  .results .controls{display:flex;justify-content:flex-start;margin-top:16px;}

  /* Pin / connector highlight states, used once results are shown */
  .mapwrap.hovering .pin{opacity:0.22;transition:opacity .15s ease, transform .15s ease;}
  .mapwrap.hovering .pin.pinActive{opacity:1;transform:translate(-50%,-100%) scale(1.18);z-index:9;}
  .mapwrap.hovering .connector line{opacity:0.08;transition:opacity .15s ease;}
  .mapwrap.hovering .connector line.lineActive{opacity:0.95;stroke-width:3;}
  .pin{transition:opacity .15s ease, transform .15s ease;}

  .modes{display:flex;gap:6px;flex-wrap:wrap;}
  .modes button{
    font-family:'Work Sans',sans-serif;font-weight:600;font-size:13px;
    padding:8px 14px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--ink);cursor:pointer;
  }
  .modes button small{opacity:.6;font-weight:500;margin-left:3px;}
  .modes button:hover{background:rgba(28,42,46,0.06);}
  .modes button.active{background:var(--ink);color:#fbf8f1;border-color:var(--ink);}
  .modes button.active small{opacity:.75;}

  @media (max-width:640px){
    .hud{gap:14px;margin-left:auto;padding-left:14px;}
    .prompt{padding:14px;gap:12px;}
  }
</style>
</head>

<div class="doorstripe"><span></span><span></span><span></span><span></span></div>

<header>

const MODES = {easy:10, medium:20, hard:30, full:SUBURBS.length};
let mode = 'easy';
let gameId = 0;
let TOTAL_ROUNDS = MODES[mode];
let order = [], roundIdx = 0, totalScore = 0, results = [], locked = false;

const gameGrid = document.getElementById('gameGrid');
const mapWrap = document.getElementById('mapWrap');
const mapCanvas = document.getElementById('mapCanvas');
const mapImg = document.getElementById('mapImg');
const connector = document.getElementById('connector');
const hint = document.getElementById('hint');
const resultsPanel = document.getElementById('results');

const MIN_SCALE = 1, MAX_SCALE = 5;
let scale = 1, tx = 0, ty = 0;

function clampNum(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }

function clampPan(rect){
  const minTx = rect.width * (1 - scale), maxTx = 0;
  const minTy = rect.height * (1 - scale), maxTy = 0;
  tx = clampNum(tx, minTx, maxTx);
  ty = clampNum(ty, minTy, maxTy);
}

function applyTransform(){
  mapCanvas.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
}

function resetZoom(){
  scale = 1; tx = 0; ty = 0;
  applyTransform();
}

function zoomAt(mx, my, factor){
  const rect = mapWrap.getBoundingClientRect();
  const canvasX = (mx - tx) / scale, canvasY = (my - ty) / scale;
  scale = clampNum(scale * factor, MIN_SCALE, MAX_SCALE);
  tx = mx - canvasX * scale;
  ty = my - canvasY * scale;
  clampPan(rect);
  applyTransform();
}

mapWrap.addEventListener('wheel', function(e){
  e.preventDefault();
  const rect = mapWrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const factor = Math.exp(-e.deltaY * 0.0015);
  zoomAt(mx, my, factor);
}, {passive:false});

document.getElementById('zoomIn').addEventListener('click', function(){
  const rect = mapWrap.getBoundingClientRect();
  zoomAt(rect.width/2, rect.height/2, 1.5);
});
document.getElementById('zoomOut').addEventListener('click', function(){
  const rect = mapWrap.getBoundingClientRect();
  zoomAt(rect.width/2, rect.height/2, 1/1.5);
});
document.getElementById('zoomReset').addEventListener('click', resetZoom);

let dragging = false, dragMoved = false, startPX = 0, startPY = 0, startTx = 0, startTy = 0;

mapWrap.addEventListener('pointerdown', function(e){
  if(e.target.closest('.zoomctl')) return;
  dragging = true; dragMoved = false;
  startPX = e.clientX; startPY = e.clientY; startTx = tx; startTy = ty;
  mapWrap.setPointerCapture(e.pointerId);
});
mapWrap.addEventListener('pointermove', function(e){
  if(!dragging) return;
  const dx = e.clientX - startPX, dy = e.clientY - startPY;
  if(Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
  if(scale > 1 && dragMoved){
    mapWrap.classList.add('panning');
    tx = startTx + dx; ty = startTy + dy;
    clampPan(mapWrap.getBoundingClientRect());
    applyTransform();
  }
});
mapWrap.addEventListener('pointerup', function(e){
  if(!dragging) return;
  dragging = false;
  mapWrap.classList.remove('panning');
  if(!dragMoved){
    placeGuess(e);
  }
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startGame(){
  gameId++;
  TOTAL_ROUNDS = Math.min(MODES[mode], SUBURBS.length);
  order = shuffle(SUBURBS).slice(0, TOTAL_ROUNDS);
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  roundIdx = 0; totalScore = 0; results = []; locked = false;
  gameGrid.classList.remove('finished');
  mapWrap.classList.remove('hovering');
  resetZoom();
  document.getElementById('hudScore').textContent = '0';
  clearMarkers();
  connector.innerHTML = '';
  renderRound();
}

function renderRound(){
  locked = false;
  mapWrap.classList.remove('locked');
  hint.textContent = 'Click the map to place your pin. Scroll to zoom, drag to pan.';
  document.getElementById('hudRound').textContent = (roundIdx+1) + ' / ' + TOTAL_ROUNDS;
  document.getElementById('targetName').textContent = order[roundIdx].n;
}

function clearMarkers(){
  mapWrap.querySelectorAll('.pin, .toast').forEach(el => el.remove());
}

function pinSVG(color, size){
  size = size || 34;
  return `<svg width="${size}" height="${size*1.3}" viewBox="0 0 40 52" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 2C10 2 3 9.5 3 19c0 13 17 30 17 30s17-17 17-30C37 9.5 30 2 20 2z" fill="${color}" stroke="#1c2a2e" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="7" fill="#fbf8f1"/>
  </svg>`;
}

function placePin(xFrac, yFrac, color, size, label, isAnswer, idx){
  const el = document.createElement('div');
  el.className = 'pin' + (isAnswer ? ' answer' : '');
  if(idx !== undefined) el.dataset.idx = idx;
  el.style.left = (xFrac*100) + '%';
  el.style.top = (yFrac*100) + '%';
  el.innerHTML = pinSVG(color, size) + (label ? `<div class="lbl">${label}</div>` : '');
  mapCanvas.appendChild(el);
  return el;
}

function placeGuess(e){
  if(locked) return;
  locked = true;
  mapWrap.classList.add('locked');
  const rect = mapWrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const gx = (mx - tx) / scale / rect.width;
  const gy = (my - ty) / scale / rect.height;
  const target = order[roundIdx];
  const idx = roundIdx;
  const gid = gameId;

  placePin(gx, gy, '#1f4e8c', 30, target.n, false, idx);

  const dxpx = (gx - target.x) * IMG_W;
  const dypx = (gy - target.y) * IMG_H;
  const distPx = Math.sqrt(dxpx*dxpx + dypx*dypx);
  const km = (distPx * 0.0241).toFixed(1);
  const points = Math.max(0, Math.round(1000 * Math.exp(-distPx/280)));

  totalScore += points;
  document.getElementById('hudScore').textContent = totalScore;
  results.push({name: target.n, km: km, points: points, gx: gx, gy: gy});

  hint.textContent = (roundIdx === TOTAL_ROUNDS-1)
    ? 'Guess locked in for ' + target.n + '. Tallying your score…'
    : 'Guess locked in for ' + target.n + '. Next place coming up…';

  setTimeout(function(){
    if(gid !== gameId) return;
    roundIdx++;
    if(roundIdx >= TOTAL_ROUNDS){
      revealAll();
      showFinal();
    } else {
      renderRound();
    }
  }, 850);
}

function revealAll(){
  order.forEach((target, i) => {
    const r = results[i];
    placePin(target.x, target.y, '#2f6b4f', 30, target.n, true, i);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.dataset.idx = i;
    line.setAttribute('x1', r.gx); line.setAttribute('y1', r.gy);
    line.setAttribute('x2', target.x); line.setAttribute('y2', target.y);
    line.setAttribute('stroke', '#1c2a2e'); line.setAttribute('stroke-width', '2');
    line.setAttribute('stroke-dasharray', '6 5'); line.setAttribute('opacity', '0.6');
    line.setAttribute('vector-effect', 'non-scaling-stroke');
    connector.appendChild(line);
  });
  hint.textContent = 'Blue pins are your guesses, green are the real spots. Hover a row to compare. Scroll to zoom.';
}

function highlightIdx(idx){
  mapWrap.classList.add('hovering');
  mapWrap.querySelectorAll('.pin').forEach(p => {
    p.classList.toggle('pinActive', p.dataset.idx === String(idx));
  });
  connector.querySelectorAll('line').forEach(l => {
    l.classList.toggle('lineActive', l.dataset.idx === String(idx));
  });
}

function clearHighlight(){
  mapWrap.classList.remove('hovering');
  mapWrap.querySelectorAll('.pin').forEach(p => p.classList.remove('pinActive'));
  connector.querySelectorAll('line').forEach(l => l.classList.remove('lineActive'));
}

function rankFor(pct){
  if(pct >= 90) return "True Dub — you know every corner";
  if(pct >= 75) return "Dublin Local";
  if(pct >= 55) return "Culchie with a good sense of direction";
  if(pct >= 35) return "Blow-in, still learning the map";
  return "Tourist — bring a GPS next time";
}

function showFinal(){
  const maxScore = TOTAL_ROUNDS * 1000;
  const pct = Math.round(100 * totalScore / maxScore);
  document.getElementById('finalScore').textContent = totalScore.toLocaleString();
  document.getElementById('finalOutOf').textContent = 'out of ' + maxScore.toLocaleString() + ' (' + pct + '%)';
  document.getElementById('finalRank').textContent = rankFor(pct);
  const tbody = document.getElementById('finalTable');
  tbody.innerHTML = '';
  results.forEach((r, i) => {
    const tr = document.createElement('tr');
    tr.className = 'resultRow';
    tr.dataset.idx = i;
    tr.innerHTML = '<td>'+r.name+'</td><td>'+r.km+' km</td><td class="pts">'+r.points+'</td>';
    tr.addEventListener('mouseenter', function(){
      highlightIdx(i);
      tbody.querySelectorAll('tr').forEach(row => row.classList.remove('rowActive'));
      tr.classList.add('rowActive');
    });
    tr.addEventListener('mouseleave', function(){
      clearHighlight();
      tr.classList.remove('rowActive');
    });
    tbody.appendChild(tr);
  });
  gameGrid.classList.add('finished');
  hint.textContent = 'Blue pins are your guesses, green are the real spots. Hover a row to compare.';
}

document.getElementById('againBtn').addEventListener('click', startGame);
document.getElementById('fullCount').textContent = SUBURBS.length;
document.querySelectorAll('#modes button').forEach(b => b.addEventListener('click', function(){
  mode = b.dataset.mode;
  startGame();
}));
startGame();
</script>
